<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Circle Base -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="#A7F3D0" stroke-width="4" />
  <circle cx="100" cy="100" r="82" fill="#FFFFFF" opacity="0.6" />

  <!-- Grocery Category Icon Group with Soft Shadow -->
  <g filter="url(#softShadow)" transform="translate(42, 38)">
    <!-- Back Items (Bottle, Apple, Carrot) -->
    <!-- Milk / Oil Bottle -->
    <rect x="22" y="16" width="18" height="42" rx="4" fill="#6EE7B7" />
    <rect x="25" y="10" width="12" height="7" rx="2" fill="#047857" />
    <rect x="25" y="26" width="12" height="14" rx="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Carrot -->
    <path d="M72 16 L88 38 L68 46 Z" fill="url(#orangeGrad)" />
    <!-- Carrot Leaves -->
    <path d="M72 16 L74 6 M72 16 L65 8 M72 16 L80 9" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

    <!-- Apple / Fruit -->
    <circle cx="56" cy="38" r="14" fill="#EF4444" />
    <path d="M56 24 C57 20 62 18 64 21" stroke="#047857" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="52" cy="34" r="3" fill="#FCA5A5" />

    <!-- Front Grocery Basket -->
    <path d="M8 44 H108 L98 94 C97 99 92 103 86 103 H30 C24 103 19 99 18 94 L8 44 Z" fill="url(#cartGrad)" />
    
    <!-- Basket Rim -->
    <rect x="4" y="38" width="108" height="9" rx="4.5" fill="#065F46" />
    
    <!-- Basket Texture Lines -->
    <path d="M22 54 L32 94 M42 54 L48 94 M58 54 L58 94 M74 54 L68 94 M94 54 L84 94" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

    <!-- Basket Handle -->
    <path d="M30 40 C30 18 86 18 86 40" stroke="#065F46" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>
