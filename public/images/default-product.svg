<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <!-- Subtle Background Card -->
  <rect width="300" height="300" rx="32" fill="#F0FDF4" />
  <rect x="4" y="4" width="292" height="292" rx="28" fill="none" stroke="#DCFCE7" stroke-width="3" />

  <!-- Ambient Glow Circle -->
  <circle cx="150" cy="140" r="75" fill="#DCFCE7" />

  <!-- Grocery Shopping Bag / Basket Illustration -->
  <g transform="translate(75, 65)">
    <!-- Bag Handles -->
    <path d="M45 55 V35 C45 22 55 12 75 12 C95 12 105 22 105 35 V55" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" />
    
    <!-- Bag Body -->
    <path d="M25 55 L35 130 C36 138 43 145 52 145 H98 C107 145 114 138 115 130 L125 55 Z" fill="#10B981" />
    
    <!-- Bag Front Fold / Shadow Accent -->
    <path d="M35 68 L42 122 C43 128 48 133 55 133 H95 C102 133 107 128 108 122 L115 68 Z" fill="#059669" opacity="0.35" />

    <!-- Cute Leaf / Freshness Accent -->
    <path d="M85 30 C85 30 102 24 106 38 C110 52 94 56 94 56 C94 56 78 50 85 30 Z" fill="#34D399" />
    <path d="M85 32 C92 42 100 48 105 52" stroke="#047857" stroke-width="2" stroke-linecap="round" />

    <!-- Shopping Star Sparkle -->
    <path d="M75 80 L77 92 L89 94 L77 96 L75 108 L73 96 L61 94 L73 92 Z" fill="#FEF08A" />
  </g>

  <!-- Clean Subtext -->
  <text x="150" y="242" text-anchor="middle" font-family="'Hind Siliguri', 'Outfit', sans-serif" font-size="14" font-weight="700" fill="#047857" letter-spacing="0.5">
    Sodai Dorkar
  </text>
  <text x="150" y="262" text-anchor="middle" font-family="'Hind Siliguri', 'Outfit', sans-serif" font-size="11" font-weight="600" fill="#6EE7B7">
    Fresh Quality Everyday
  </text>
</svg>
